<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Fieldnote WordPress block theme</title>
  <desc id="desc">A premium editorial homepage with a field-journal hero, issue card, and asymmetric story mosaic.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a1d"/>
      <stop offset="0.58" stop-color="#26362d"/>
      <stop offset="1" stop-color="#3f5d49"/>
    </linearGradient>
    <linearGradient id="field-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dba83c"/>
      <stop offset="0.48" stop-color="#b84932"/>
      <stop offset="1" stop-color="#762d22"/>
    </linearGradient>
    <linearGradient id="field-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfd8db"/>
      <stop offset="1" stop-color="#3f5d49"/>
    </linearGradient>
    <linearGradient id="field-c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5eae5"/>
      <stop offset="1" stop-color="#dba83c"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0a0d0e" flood-opacity="0.25"/>
    </filter>
    <clipPath id="page">
      <rect x="34" y="24" width="1132" height="852" rx="14"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#d8d2c4"/>
  <rect x="34" y="24" width="1132" height="852" rx="14" fill="#f3f0e8" filter="url(#shadow)"/>

  <g clip-path="url(#page)">
    <rect x="34" y="24" width="1132" height="34" fill="#161a1d"/>
    <text x="74" y="46" fill="#bfd8db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="0.8">FIELDNOTE / INDEPENDENT STORIES FOR A CHANGING WORLD</text>
    <text x="1026" y="46" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" text-anchor="end">ISSUE 08</text>
    <text x="1128" y="46" fill="#dba83c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" text-anchor="end">EXPLORE →</text>

    <rect x="34" y="58" width="1132" height="70" fill="#f3f0e8"/>
    <line x1="34" y1="128" x2="1166" y2="128" stroke="#d8d2c4"/>
    <circle cx="77" cy="93" r="6" fill="#b84932"/>
    <circle cx="77" cy="93" r="11" fill="none" stroke="#b84932" stroke-opacity="0.22" stroke-width="5"/>
    <text x="101" y="102" fill="#161a1d" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="31" font-weight="600" letter-spacing="-1.2">Fieldnote</text>
    <text x="732" y="98" fill="#161a1d" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">STORIES</text>
    <text x="814" y="98" fill="#161a1d" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">TOPICS</text>
    <text x="892" y="98" fill="#161a1d" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">ABOUT</text>
    <rect x="976" y="77" width="152" height="34" rx="17" fill="#161a1d"/>
    <text x="1052" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing="0.7" text-anchor="middle">GET THE FIELD LETTER</text>

    <rect x="34" y="128" width="1132" height="430" fill="url(#night)"/>
    <circle cx="1116" cy="164" r="174" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="640" cy="574" r="128" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <line x1="82" y1="187" x2="112" y2="187" stroke="#bfd8db"/>
    <text x="124" y="191" fill="#bfd8db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700" letter-spacing="1.4">ISSUE 08 · NOTES FROM THE EDGE</text>
    <text x="82" y="274" fill="#ffffff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="66" font-weight="600" letter-spacing="-3">Look closer.</text>
    <text x="82" y="340" fill="#ffffff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="66" font-weight="600" letter-spacing="-3">Tell it clearly.</text>
    <text x="84" y="387" fill="#e5eae5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5">Independent reporting, grounded essays, and useful ideas</text>
    <text x="84" y="412" fill="#e5eae5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="16.5">for people curious about how the world is changing.</text>
    <rect x="82" y="454" width="172" height="42" rx="21" fill="#dba83c"/>
    <text x="168" y="480" fill="#161a1d" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="0.7" text-anchor="middle">READ THE LATEST ISSUE</text>
    <rect x="267" y="454" width="160" height="42" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.75"/>
    <text x="347" y="480" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="10" font-weight="800" letter-spacing="0.7" text-anchor="middle">WHY FIELDNOTE EXISTS</text>

    <g transform="translate(797 168)">
      <rect width="294" height="344" rx="7" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.22"/>
      <rect width="294" height="344" rx="7" fill="url(#grid)"/>
      <text x="27" y="39" fill="#bfd8db" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1">FIELD JOURNAL / 2026</text>
      <text x="24" y="189" fill="#ffffff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="126" font-weight="600" letter-spacing="-11">08</text>
      <line x1="27" y1="226" x2="267" y2="226" stroke="#dba83c" stroke-width="2"/>
      <text x="27" y="259" fill="#e5eae5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5">Patient technology, public spaces,</text>
      <text x="27" y="279" fill="#e5eae5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5">and the quiet work behind lasting</text>
      <text x="27" y="299" fill="#e5eae5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5">change.</text>
      <circle cx="252" cy="319" r="4" fill="#dba83c"/>
    </g>

    <rect x="34" y="558" width="1132" height="318" fill="#f3f0e8"/>
    <line x1="72" y1="598" x2="1128" y2="598" stroke="#d8d2c4"/>
    <line x1="72" y1="620" x2="100" y2="620" stroke="#762d22"/>
    <text x="112" y="624" fill="#762d22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" font-weight="700" letter-spacing="1.2">THE CURRENT ISSUE</text>
    <text x="72" y="670" fill="#161a1d" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="35" font-weight="600" letter-spacing="-1.2">Stories worth carrying with you.</text>
    <text x="805" y="625" fill="#465153" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5">Reporting, conversations, and practical notes</text>
    <text x="805" y="644" fill="#465153" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="12.5">selected by the editors.</text>

    <g transform="translate(72 706)">
      <rect width="498" height="202" rx="5" fill="url(#field-a)"/>
      <path d="M0 153 C100 96 195 185 297 120 C373 71 430 115 498 66 L498 202 L0 202 Z" fill="#161a1d" fill-opacity="0.20"/>
      <line x1="24" y1="166" x2="52" y2="166" stroke="#ffffff"/>
      <text x="62" y="170" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="700" letter-spacing="1">FIELDWORK</text>
      <text x="24" y="197" fill="#ffffff" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="22" font-weight="600">The patient work behind public change</text>
    </g>

    <g transform="translate(594 706)">
      <rect width="250" height="96" rx="5" fill="url(#field-b)"/>
      <circle cx="196" cy="30" r="42" fill="none" stroke="#ffffff" stroke-opacity="0.35"/>
      <text x="14" y="116" fill="#762d22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8">DESIGN</text>
      <text x="14" y="140" fill="#161a1d" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="16.5" font-weight="600">A city made for lingering</text>
    </g>

    <g transform="translate(868 706)">
      <rect width="260" height="96" rx="5" fill="url(#field-c)"/>
      <path d="M22 75 L91 22 L143 62 L200 16 L240 50" fill="none" stroke="#161a1d" stroke-opacity="0.35" stroke-width="2"/>
      <text x="14" y="116" fill="#762d22" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8" font-weight="700" letter-spacing="0.8">PRACTICE</text>
      <text x="14" y="140" fill="#161a1d" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="16.5" font-weight="600">Tools that reward attention</text>
    </g>
  </g>

  <rect x="34.5" y="24.5" width="1131" height="851" rx="13.5" fill="none" stroke="#161a1d" stroke-opacity="0.14"/>
</svg>
