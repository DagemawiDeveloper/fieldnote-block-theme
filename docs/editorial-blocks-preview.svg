	<text x="625" y="856" fill="#465153" font-family="Arial, sans-serif" font-size="18">Reliability is often invisible. We followed the safeguards that keep</text>
	<text x="625" y="883" fill="#465153" font-family="Arial, sans-serif" font-size="18">a public dataset useful after the launch-day excitement has passed.</text>
